<!doctype html>
<!-- A local stand-in for OpenEMR's new-patient and vitals screens, so the bench runs before OpenEMR is up.
     Save only records that it was pressed: nothing is sent anywhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Encounter - Intake</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #2c3e50; color: #fff; padding: 10px 20px; font-weight: 600; }
  form { max-width: 760px; margin: 16px auto; background: #fff; padding: 16px 24px; border: 1px solid #ddd; }
  fieldset { border: 1px solid #ccd; margin: 0 0 16px; padding: 8px 16px 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  .row { display: grid; grid-template-columns: 180px 1fr; gap: 8px; align-items: center; margin: 6px 0; }
  input, select, textarea { font: inherit; padding: 4px 6px; border: 1px solid #aab; }
  .unit { color: #666; margin-left: 6px; }
  #status { margin-left: 12px; color: #27ae60; }
</style>
</head>
<body>
<header>Clinic EHR · New Encounter</header>
<form id="intake" onsubmit="event.preventDefault(); document.body.dataset.submitted = 'true';
                             document.getElementById('status').textContent = 'Saved';">
  <fieldset>
    <legend>Patient</legend>
    <div class="row"><label for="fname">First Name</label><input id="fname" name="form_fname"></div>
    <div class="row"><label for="lname">Last Name</label><input id="lname" name="form_lname"></div>
    <div class="row"><label for="dob">DOB</label><input id="dob" name="form_DOB" placeholder="YYYY-MM-DD"></div>
    <div class="row"><label for="sex">Sex</label>
      <select id="sex" name="form_sex">
        <option value="">Unassigned</option><option>Female</option><option>Male</option><option>Unknown</option>
      </select></div>
    <div class="row"><label for="street">Address</label><input id="street" name="form_street"></div>
    <div class="row"><label for="city">City</label><input id="city" name="form_city"></div>
    <div class="row"><label for="state">State</label>
      <select id="state" name="form_state">
        <option value="">Unassigned</option><option>Connecticut</option><option>Maine</option>
        <option>Massachusetts</option><option>New Hampshire</option><option>New York</option>
        <option>Rhode Island</option><option>Vermont</option>
      </select></div>
    <div class="row"><label for="zip">Postal Code</label><input id="zip" name="form_postal_code"></div>
  </fieldset>
  <fieldset>
    <legend>Vitals</legend>
    <div class="row"><label for="weight">Weight</label><span><input id="weight" name="weight" type="number" step="0.1"><span class="unit">lb</span></span></div>
    <div class="row"><label for="height">Height</label><span><input id="height" name="height" type="number" step="0.1"><span class="unit">in</span></span></div>
    <div class="row"><label for="bps">BP Systolic</label><span><input id="bps" name="bps" type="number"><span class="unit">mmHg</span></span></div>
    <div class="row"><label for="bpd">BP Diastolic</label><span><input id="bpd" name="bpd" type="number"><span class="unit">mmHg</span></span></div>
    <div class="row"><label for="pulse">Pulse</label><span><input id="pulse" name="pulse" type="number"><span class="unit">per min</span></span></div>
    <div class="row"><label for="respiration">Respiration</label><span><input id="respiration" name="respiration" type="number"><span class="unit">per min</span></span></div>
    <div class="row"><label for="temperature">Temperature</label><span><input id="temperature" name="temperature" type="number" step="0.1"><span class="unit">°F</span></span></div>
    <div class="row"><label for="temp_method">Temp Location</label>
      <select id="temp_method" name="temp_method">
        <option value="">Unassigned</option><option>Oral</option><option>Tympanic Membrane</option>
        <option>Rectal</option><option>Axillary</option><option>Temporal Artery</option>
      </select></div>
    <div class="row"><label for="oxygen">Oxygen Saturation</label><span><input id="oxygen" name="oxygen_saturation" type="number"><span class="unit">%</span></span></div>
  </fieldset>
  <fieldset>
    <legend>History</legend>
    <div class="row"><label for="allergies">Allergies</label><textarea id="allergies" name="allergies" rows="2"></textarea></div>
  </fieldset>
  <button type="submit">Save</button><span id="status"></span>
</form>
</body>
</html>
